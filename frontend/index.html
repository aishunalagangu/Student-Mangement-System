<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <p class="subtitle">
            Manage student records easily
        </p>


        <!-- Student Form -->

        <div class="form-container">

            <h2>Add / Update Student</h2>

            <form id="studentForm">

                <input
                    type="hidden"
                    id="studentId"
                >

                <input
                    type="text"
                    id="name"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="number"
                    id="age"
                    placeholder="Age"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    id="course"
                    placeholder="Course"
                    required
                >

                <button type="submit">
                    Save Student
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    onclick="cancelUpdate()"
                >
                    Cancel
                </button>

            </form>

        </div>


        <!-- Search -->

        <div class="search-container">

            <input
                type="text"
                id="search"
                placeholder="Search student..."
            >

            <button onclick="searchStudents()">
                Search
            </button>

            <button onclick="getStudents()">
                Show All
            </button>

        </div>


        <!-- Students -->

        <div class="students-container">

            <h2>Student Records</h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Age</th>

                        <th>Email</th>

                        <th>Course</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
